packages:
  - 'apps/*'
  - 'packages/*'
onlyBuiltDependencies:
  - esbuild
  - unrs-resolver
ignoredBuiltDependencies:
  - tesseract.js

# Security fixes; keep transitive build/runtime processors on patched versions.
overrides:
  postcss: 8.5.23
  nanoid@<3.3.18: 3.3.18
  source-map-js@<1.2.2: 1.2.2
  js-yaml@4: 4.3.2
  brace-expansion@1: 1.1.21
  brace-expansion@5: 5.0.12
  postcss-selector-parser@6: 7.1.6
