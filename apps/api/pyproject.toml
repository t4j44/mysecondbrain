[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tajs-second-brain-api"
version = "1.0.0"
description = "FastAPI backend service for Taj's Second Brain"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Agent 3 - FastAPI Backend and Domain Services Agent" },
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.31",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "mcp>=2.0.0,<3.0.0",
    "python-multipart>=0.0.9",
    "tzdata>=2025.2",
    "google-genai>=0.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.8",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --cov=app --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B"]
ignore = ["B008", "E501"]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["pydantic.validator", "validator", "pydantic.field_validator", "field_validator"]


[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false
plugins = ["pydantic.mypy"]
