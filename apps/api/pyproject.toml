[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tajs-second-brain-api"
version = "1.0.0"
description = "FastAPI backend service for Taj's Second Brain"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Agent 3 - FastAPI Backend and Domain Services Agent" },
]
dependencies = [
    "markitdown[pdf,docx,pptx,xlsx]==0.1.5",
    "fastapi>=0.111.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic>=2.8.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",
    "email-validator>=2.0.0,<3.0.0",
    "dnspython>=2.9.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.31,<3.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "pgvector>=0.3.0,<1.0.0",
    "pyjwt>=2.15.0,<3.0.0",
    "cryptography>=50.0.0,<51.0.0",
    "httpx>=0.27.0,<1.0.0",
    "mcp>=2.2.0,<3.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "tzdata>=2025.2",
    "google-genai>=0.1.1,<1.0.0",
    "websockets>=14.2,<17.0",
    "pypdf>=6.21.2,<7.0.0",
    "pillow>=13.0.0,<14.0.0",
    "urllib3>=2.8.0,<3.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-cov>=5.0.0,<7.0.0",
    "ruff>=0.5.0,<1.0.0",
    "mypy>=1.10.0,<2.0.0",
    "bandit>=1.7.8,<2.0.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --cov=app --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "postgres: requires a migrated PostgreSQL database (POSTGRES_TEST_DATABASE_URL); never production",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B"]
ignore = ["B008", "E501"]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["pydantic.validator", "validator", "pydantic.field_validator", "field_validator"]


[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pypdf", "pypdf.*"]
ignore_missing_imports = true
