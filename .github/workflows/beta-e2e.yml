name: Closed beta staging E2E
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  beta-journey:
    runs-on: ubuntu-latest
    environment: beta-staging
    env:
      CI: 'true'
      # These are deliberately pinned public staging endpoints; no dynamic production target.
      PLAYWRIGHT_TEST_BASE_URL: https://second-brain-web-staging-seven.vercel.app
      NEXT_PUBLIC_API_BASE_URL: https://second-brain-api-staging.onrender.com/api/v1
      NEXT_PUBLIC_SUPABASE_URL: https://rpkjmdrralzxhdsgceal.supabase.co
      BETA_SUPABASE_PROJECT_REF: rpkjmdrralzxhdsgceal
      PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.BETA_SUPABASE_PUBLISHABLE_KEY }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_EMAIL_B: ${{ secrets.E2E_EMAIL_B }}
      E2E_PASSWORD_B: ${{ secrets.E2E_PASSWORD_B }}
    steps:
      - uses: actions/checkout@v4
      - name: Require isolated staging and two test users
        shell: bash
        run: |
          for key in PLAYWRIGHT_TEST_BASE_URL NEXT_PUBLIC_API_BASE_URL NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY BETA_SUPABASE_PROJECT_REF PRODUCTION_SUPABASE_PROJECT_REF E2E_EMAIL E2E_PASSWORD E2E_EMAIL_B E2E_PASSWORD_B; do
            if [ -z "${!key}" ]; then echo "Missing required setting: $key"; exit 1; fi
          done
          if [ "$BETA_SUPABASE_PROJECT_REF" != "rpkjmdrralzxhdsgceal" ]; then echo "Unexpected Supabase project"; exit 1; fi
          if [ "$BETA_SUPABASE_PROJECT_REF" = "$PRODUCTION_SUPABASE_PROJECT_REF" ]; then echo "Staging must differ from production"; exit 1; fi
          if [ "$PLAYWRIGHT_TEST_BASE_URL" != "https://second-brain-web-staging-seven.vercel.app" ]; then echo "Wrong web target"; exit 1; fi
          if [ "$NEXT_PUBLIC_API_BASE_URL" != "https://second-brain-api-staging.onrender.com/api/v1" ]; then echo "Wrong API target"; exit 1; fi
          if [ "$NEXT_PUBLIC_SUPABASE_URL" != "https://$BETA_SUPABASE_PROJECT_REF.supabase.co" ]; then echo "Staging project identity mismatch"; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @second-brain/web exec playwright install --with-deps chromium
      - run: pnpm --filter @second-brain/web test:e2e
      - run: python scripts/check_test_evidence.py apps/web/test-results/e2e-results.xml
      # Reports use dedicated synthetic test accounts. Do not upload cookies or auth state.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta-e2e-evidence
          path: apps/web/test-results/e2e-results.xml
          retention-days: 7
