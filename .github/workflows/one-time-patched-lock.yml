name: One-time dependency lock repair (release branch)
on:
  push:
    branches:
      - codex/pg17-release-proof-20261101
    paths:
      - '.github/workflows/one-time-patched-lock.yml'
permissions:
  contents: write
jobs:
  regenerate-patched-lock:
    if: github.repository == 't4j44/mysecondbrain' && github.ref == 'refs/heads/codex/pg17-release-proof-20261101'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install a pinned lockfile generator
        run: python -m pip install 'uv==0.9.18'
      - name: Upgrade only the two vulnerable dependencies
        run: |
          uv lock --project apps/api --upgrade-package pyasn1 --upgrade-package pypdf
          uv export --project apps/api --frozen --all-extras --no-emit-project --output-file apps/api/requirements.lock
      - name: Verify patched versions and file scope
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path
          packages = {p['name']: p['version'] for p in tomllib.loads(Path('apps/api/uv.lock').read_text())['package']}
          assert tuple(map(int, packages['pyasn1'].split('.'))) >= (0, 6, 5), packages['pyasn1']
          assert tuple(map(int, packages['pypdf'].split('.'))) >= (6, 21, 4), packages['pypdf']
          lock = Path('apps/api/requirements.lock').read_text()
          assert f"pyasn1=={packages['pyasn1']}" in lock
          assert f"pypdf=={packages['pypdf']}" in lock
          print('PASS patched versions and hash-lock export')
          PY
          git diff --check
          git diff --name-only
      - name: Commit refreshed hashes to isolated review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/uv.lock apps/api/requirements.lock
          if git diff --staged --quiet; then
            echo 'No dependency changes produced'
          else
            git commit -m 'security: refresh verified hashes for patched pyasn1 and pypdf'
            git push origin HEAD:codex/pg17-release-proof-20261101
          fi
