name: One-time Next.js 15.5.28 lock refresh
on:
  push:
    branches: [codex/second-brain-release-hardening]
    paths:
      - .github/workflows/next-patch-lock-once.yml

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'chore(security): start one-off Next.js lock refresh' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - name: Update exact 15.x patch versions only
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'apps/web/package.json';
          const p = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (p.dependencies.next !== '15.5.27' || p.devDependencies['eslint-config-next'] !== '15.5.27') {
            throw new Error('Versions changed; refusing automatic edit');
          }
          p.dependencies.next = '15.5.28';
          p.devDependencies['eslint-config-next'] = '15.5.28';
          fs.writeFileSync(file, JSON.stringify(p, null, 2) + '\n');
          NODE
      - name: Resolve new dependency integrity hashes
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Check browser production dependencies
        run: pnpm audit --prod
      - name: Commit updated manifest and lockfile to hardening branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json pnpm-lock.yaml
          git diff --cached --exit-code && { echo "Nothing changed"; exit 1; } || true
          git commit -m "security(web): update Next.js and ESLint config to 15.5.28"
          git push origin HEAD:codex/second-brain-release-hardening
