name: Second Brain isolated hosted smoke (no credentials)
on:
  push:
    branches: [codex/staging-live-smoke]
    paths:
      - .github/workflows/staging-public-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      STAGING_API: https://second-brain-api-staging.onrender.com
      STAGING_WEB: https://second-brain-web-staging-seven.vercel.app
      EXPECTED_SHA: c32315b8791d8b118fbc8bd7573a57547c132b94
    steps:
      - name: Check live staging endpoints, identity, and anonymous security
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          api = os.environ["STAGING_API"].rstrip("/")
          web = os.environ["STAGING_WEB"].rstrip("/")
          expected = os.environ["EXPECTED_SHA"]

          def request(url, headers=None, method="GET", timeout=50):
              req = urllib.request.Request(url, headers=headers or {}, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, dict(r.headers), r.read(8192)
              except urllib.error.HTTPError as e:
                  return e.code, dict(e.headers), e.read(8192)

          def get_with_wake(path, attempts=4):
              for attempt in range(1, attempts + 1):
                  try:
                      code, headers, payload = request(api + path)
                      if code in (502, 503, 504) and attempt < attempts:
                          print(f"{path}: HTTP {code}; waiting for cold start (attempt {attempt})")
                          time.sleep(20)
                          continue
                      return code, headers, payload
                  except (urllib.error.URLError, TimeoutError) as e:
                      if attempt == attempts:
                          raise AssertionError(f"{path}: unavailable after {attempts} attempts ({type(e).__name__})")
                      time.sleep(20)
              raise AssertionError(path + " never returned a response")

          for path, key, value in [
              ("/health/live", "status", "alive"),
              ("/health/ready", "database", "connected"),
              ("/health", "environment", "staging"),
          ]:
              code, headers, payload = get_with_wake(path)
              assert code == 200, f"{path} HTTP {code}"
              data = json.loads(payload)
              assert data.get(key) == value, f"{path}: {key} mismatch"
              if path == "/health":
                  assert data.get("release_sha") == expected, "API is not the expected release SHA"
              print(f"PASS {path}: HTTP 200, expected {key}")

          code, headers, payload = get_with_wake("/api/v1/meetings/usage")
          assert code in (401, 403), f"Anonymous meetings usage returned unexpected HTTP {code}"
          print(f"PASS protected meeting route denies anonymous HTTP {code}")

          code, headers, payload = request(
              api + "/api/v1/health",
              headers={
                  "Origin": web,
                  "Access-Control-Request-Method": "GET",
                  "Access-Control-Request-Headers": "authorization,content-type",
              },
              method="OPTIONS",
          )
          assert code in (200, 204), f"Allowed-origin CORS preflight HTTP {code}"
          assert headers.get("access-control-allow-origin") == web, "Allowed staging origin not authorized"
          print("PASS staging CORS allowlist")

          rogue = "https://definitely-not-secondbrain-staging.invalid"
          code, headers, payload = request(
              api + "/api/v1/health",
              headers={"Origin": rogue, "Access-Control-Request-Method": "GET"},
              method="OPTIONS",
          )
          assert headers.get("access-control-allow-origin") != rogue, "Untrusted origin was permitted by CORS"
          print("PASS untrusted cross-origin access denied")

          try:
              code, headers, payload = request(web + "/login", timeout=45)
              if code in (401, 403):
                  print("PASS staging frontend is protected by Vercel access control")
              elif code == 200:
                  assert b"<html" in payload.lower() or b"<!doctype html" in payload.lower()
                  print("PASS staging frontend serves HTML (login UX not authenticated)")
              else:
                  raise AssertionError(f"Staging web /login unexpected HTTP {code}")
          except urllib.error.URLError as e:
              raise AssertionError(f"Staging frontend network check failed: {type(e).__name__}") from None
          PY
