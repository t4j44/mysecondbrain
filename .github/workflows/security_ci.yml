name: Security & Quality CI

on:
  push:
    branches: [ main, develop, recovery/**, codex/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  security-audit:
    name: Security & Quality Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy bandit pytest pytest-cov -r apps/api/requirements.txt

      - name: Run Ruff Linter
        run: |
          ruff check apps/api

      - name: Run Bandit Security Scanner
        run: |
          bandit -r apps/api/app

      - name: Run Pytest Security & Backend Suite
        env:
          PYTHONPATH: "apps/api"
          SUPABASE_URL: "https://mock.supabase.co"
          SUPABASE_SECRET_KEY: "sb_secret_mock_secret_key_for_testing_only"
          SUPABASE_SERVICE_ROLE_KEY: "mock_service_role_key_for_testing_only"
          SUPABASE_JWT_SECRET: "mock_jwt_secret_for_local_pytest_suite_only_32bytes"
          TOKEN_ENCRYPTION_KEY: "mock_token_encryption_key_for_local_tests"
          GEMINI_API_KEY: "mock_gemini_key"
        run: |
          pytest apps/api/tests/ --ignore=apps/api/tests/integration --cov=app --cov-report=term-missing

      - name: Run Mypy Typecheck
        run: |
          mypy --config-file apps/api/pyproject.toml apps/api/app

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Run Frontend Typecheck & Lint
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://mock.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "mock-anon-key-for-ci-typecheck-only"
          NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000/api/v1"
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @second-brain/web lint
          pnpm --filter @second-brain/web typecheck
          pnpm --filter @second-brain/web test

      - name: Run Frontend Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://mock.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "mock-anon-key-for-ci-build-only"
          NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000/api/v1"
        run: |
          pnpm --filter @second-brain/web build
